<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>超級猴子兄弟 – Super Monkey Bros.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #1a1a2e;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; font-family: "Press Start 2P", monospace; overflow: hidden;
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
  }
  h1 { color: #f7c531; font-size: 14px; letter-spacing: 2px; text-shadow: 2px 2px 0 #000; }
  #wrap { position: relative; width: min(96vw, 960px); }
  canvas {
    display: block; width: 100%; image-rendering: pixelated; image-rendering: crisp-edges;
    border: 4px solid #000; border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,.6);
    background: #5c94fc;
  }
  #hint { color: #9aa0c0; font-size: 9px; line-height: 1.9; text-align: center; }
  #hint b { color: #fff; }
  #touch { position: fixed; inset: auto 0 0 0; display: none; justify-content: space-between;
           padding: 0 18px 18px; pointer-events: none; z-index: 9; }
  #touch .grp { display: flex; gap: 14px; pointer-events: auto; }
  .btn {
    width: 64px; height: 64px; border-radius: 50%; border: 3px solid rgba(255,255,255,.5);
    background: rgba(0,0,0,.45); color: #fff; font-family: inherit; font-size: 18px;
    display: flex; align-items: center; justify-content: center; touch-action: none;
  }
  .btn:active { background: rgba(255,255,255,.3); }
  @media (pointer: coarse) { #touch { display: flex; } body { overflow: auto; } }
</style>
</head>
<body>
<h1>🍌 超級猴子兄弟 SUPER MONKEY BROS.</h1>
<div id="wrap"><canvas id="game" width="960" height="528"></canvas></div>
<div id="hint">
  <b>← →</b> 移動　<b>SHIFT/X</b> 跑・丟火球　<b>空白鍵/Z/↑</b> 跳躍　<b>↓</b> 蹲下　<b>M</b> 音樂　<b>P</b> 暫停　<b>ENTER</b> 開始
</div>
<div id="touch">
  <div class="grp">
    <button class="btn" data-k="left">◀</button>
    <button class="btn" data-k="down">▼</button>
    <button class="btn" data-k="right">▶</button>
  </div>
  <div class="grp">
    <button class="btn" data-k="run">B</button>
    <button class="btn" data-k="jump">A</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
